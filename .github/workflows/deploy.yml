name: Deploy site to GitHub Pages

# NOTE: This workflow did not previously exist in the repo. It was authored from
# the "Deploy & domain" section of BRIEF.md (official GitHub Pages path:
# configure-pages / upload-pages-artifact / deploy-pages; recursive submodule
# checkout; Hugo extended; production baseURL). It additionally generates the
# paper PDFs with headless Chromium between the Hugo build and the artifact upload.
# Requires repo Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.148.0
      HUGO_ENVIRONMENT: production
      HUGO_ENV: production
      SITE_BASEURL: https://joelbmarks.com
    steps:
      - name: Install Hugo CLI (extended)
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Checkout (with theme submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Build with Hugo
        run: hugo --gc --minify --baseURL "${SITE_BASEURL}/"

      # Generate the paper PDFs into public/papers/<slug>.pdf so they ship in the
      # deploy. Must run after the Hugo build and before the artifact upload.
      - name: Generate paper PDFs (headless Chromium)
        run: node scripts/generate-paper-pdfs.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
