baseURL: "https://joelbmarks.com/"
languageCode: "en-gb"
title: "Joel B. Marks"
theme: "PaperMod"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 10

minify:
  disableXML: true
  minifyOutput: true

markup:
  highlight:
    # Class-based Chroma output (no baked-in inline colours), so PaperMod's
    # theme CSS — and our light-mode --code-block-bg override — control the
    # background. Highlighting stays ON; token palette is PaperMod's chroma CSS.
    noClasses: false
  tableOfContents:
    # Drives the paper sidebar TOC (.TableOfContents in layouts/papers/single.html).
    startLevel: 2
    endLevel: 3
    ordered: false

params:
  env: production
  title: "Joel B. Marks"
  description: "Joel B. Marks"
  author: "Joel B. Marks"
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: false
  ShowShareButtons: false
  ShowPostNavLinks: false
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowToc: false
  ShowWordCount: false
  hideFooter: false
  # Home page must show no post feed. PaperMod builds the home list from
  # site.Params.mainSections; pointing it at an intentionally unused section
  # yields an empty list without touching any layout.
  mainSections: ["none"]
  assets:
    disableHLJS: true
    favicon: "/favicon/favicon.svg"
    favicon16x16: "/favicon/favicon-16x16.png"
    favicon32x32: "/favicon/favicon-32x32.png"
    apple_touch_icon: "/favicon/apple-touch-icon.png"
    safari_pinned_tab: "/favicon/safari-pinned-tab.svg"

# Footer menus — rendered in columns 1-3 of the site footer (layouts/_partials/
# footer.html). These are NOT the main nav (Decision 1: main menu lives in
# per-page front matter). All entries below are PLACEHOLDERS — Joel to replace
# the name/url of each with real footer links. Do not treat as final copy.
menus:
  footer1:
    - name: "Markdown cheatsheet" # PLACEHOLDER — replace
      url: "/markdown"
      weight: 10
    - name: "Theme cheatsheet" # PLACEHOLDER — replace
      url: "/theme"
      weight: 20


